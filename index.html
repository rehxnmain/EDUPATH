<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPath - Login | Code SlayeRs</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <!-- Animated Background -->
        <div class="background-animation">
            <div class="particle particle-1"></div>
            <div class="particle particle-2"></div>
            <div class="particle particle-3"></div>
            <div class="particle particle-4"></div>
            <div class="particle particle-5"></div>
        </div>

        <!-- Login Box -->
        <div class="login-box">
            <!-- Branding -->
            <div class="brand-logo">
                <div class="logo-icon">
                    <i class="fas fa-graduation-cap"></i>
                </div>
                <h1 class="brand-name">EduPath</h1>
                <p class="brand-tagline">Bridging Academia & Industry</p>
                <div class="code-slayers-badge">
                    <i class="fas fa-code"></i>
                    <span>A Code Slayers Creation</span>
                </div>
            </div>

            <!-- Login Form -->
            <form class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i>
                        Email
                    </label>
                    <input type="email" id="email" name="email" required placeholder="Enter your email">
                </div>

                <div class="form-group">
                    <label for="password">
                        <i class="fas fa-lock"></i>
                        Password
                    </label>
                    <input type="password" id="password" name="password" required placeholder="Enter your password">
                </div>

                <div class="form-group">
                    <label for="role">
                        <i class="fas fa-user-tag"></i>
                        Select Role
                    </label>
                    <select id="role" name="role" required>
                        <option value="">Choose your role</option>
                        <option value="student">Student</option>
                        <option value="academician">Academician</option>
                        <option value="industry">Industry</option>
                        <option value="institution">Institution</option>
                    </select>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot Password?</a>
                </div>

                <button type="submit" class="btn-login">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <!-- Register Link -->
            <div class="register-link">
                <p>Don't have an account? <a href="register.html">Create Account</a></p>
            </div>

            <!-- Features Preview -->
            <div class="features-preview">
                <div class="feature-item">
                    <i class="fas fa-chart-line"></i>
                    <span>Skill Assessment</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-briefcase"></i>
                    <span>Internships</span>
                </div>
                <div class="feature-item">
                    <i class="fas fa-user-graduate"></i>
                    <span>Placements</span>
                </div>
            </div>
        </div>
    </div>
<script>
// Role-Based Dynamic Redirect
// A Code SlayeRs Creation

const loginForm = document.getElementById('loginForm');
const roleSelect = document.getElementById('role');

loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    const role = roleSelect.value;
    
    if (!role) {
        showToast('Please select a role', 'error');
        return;
    }
    
    // Show success message
    showToast('Login successful! Redirecting...', 'success');
    
    // Save session payload
    localStorage.setItem('edupath_demo', JSON.stringify({
        role: role,
        loggedIn: true,
        loginTime: new Date().toISOString()
    }));
    
    // Conditional Redirection based on selected role
    setTimeout(() => {
        if (role === 'student') {
            window.location.href = 'student-dashboard.html';
        } else if (role === 'industry') {
            window.location.href = 'industry-dashboard.html';
        }
        else if (role === 'institution') {
            window.location.href = 'institution.html';}
            else if (role === 'academician') {
            window.location.href = 'academician.html';
        }
         else {
            // Fallback default for Academician / Institution 
            window.location.href = 'student-dashboard.html';
        }
    }, 1000);
});

// Toast notification
function showToast(message, type) {
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    toast.style.cssText = `position:fixed;right:24px;bottom:24px;padding:13px 16px;border-radius:9px;background:${type==='success'?'#18b98b':'#ef4444'};color:white;font-size:11px;font-weight:700;transform:translateY(80px);opacity:0;transition:all 0.3s;z-index:10000;`;
    document.body.appendChild(toast);
    setTimeout(() => { toast.style.transform = 'translateY(0)'; toast.style.opacity = '1'; }, 10);
    setTimeout(() => { toast.style.transform = 'translateY(80px)'; toast.style.opacity = '0'; setTimeout(() => document.body.removeChild(toast), 300); }, 3000);
}

// CSS for toast
const style = document.createElement('style');
style.textContent = `@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}.login-form.error{animation:shake 0.3s ease}`;
document.head.appendChild(style);
</script>
</body>
</html>
